name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  go_test:
    name: Main Tests
    runs-on: &runner ${{ github.repository_owner == 'duckdb' && matrix.namespace || matrix.github }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
          - windows-amd64
        go: [1.24]
        # Keep native Intel coverage after merge without delaying PR checks.
        exclude: &skip-intel-on-pr ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"darwin-amd64"}]' || '[]') }}
        # Platforms map to GitHub-hosted runners by default and to DuckDB's Namespace
        # runners when the workflow runs in the duckdb organization. There is no
        # Namespace profile for Intel macOS, so runs-on falls back to github.
        include:
          # Includes run after exclusions; use an empty array on PRs to avoid
          # adding the excluded Intel job back.
          - &darwin-amd64 ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":"darwin-amd64","github":"macos-15-intel"}]') }}
          - &darwin-arm64 { platform: darwin-arm64, github: macos-26, namespace: namespace-profile-macos-arm64 }
          - &linux-amd64 { platform: linux-amd64, github: ubuntu-24.04, namespace: namespace-profile-linux-small }
          - &linux-arm64 { platform: linux-arm64, github: ubuntu-24.04-arm, namespace: namespace-profile-linux-arm64-small }
          - &windows-amd64 { platform: windows-amd64, github: windows-2025, namespace: namespace-profile-windows-x64 }
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Main Tests
        run: go test -v

  go_race_test:
    name: Race Tests
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform: [linux-amd64]
        go: [1.24]
        include: [*linux-amd64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Race Tests
        run: go test -race -count=1 ./...

  test_examples:
    name: Test Examples
    runs-on: *runner
    timeout-minutes: 15
    strategy:
      matrix:
        platform:
          - darwin-arm64
          - linux-amd64
        go: [1.24]
        include: [*darwin-arm64, *linux-amd64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test Examples
        run: make test.examples

  test-arrow:
    name: Test Arrow
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-arm64
          - linux-amd64
          - windows-amd64
        go: [1.24]
        include: [*darwin-arm64, *linux-amd64, *windows-amd64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Arrow Tests
        run: go test -v -tags=duckdb_arrow

  test-dynamic-lib:
    name: Dynamic Lib Tests
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        go: [1.24]
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
        exclude: *skip-intel-on-pr
        include:
          - *darwin-amd64
          - *darwin-arm64
          - *linux-amd64
          - *linux-arm64
          - ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":"darwin-amd64","ld_path_env_name":"DYLD_LIBRARY_PATH"}]') }}
          - platform: "darwin-arm64"
            ld_path_env_name: "DYLD_LIBRARY_PATH"
          - platform: "linux-amd64"
            ld_path_env_name: "LD_LIBRARY_PATH"
          - platform: "linux-arm64"
            ld_path_env_name: "LD_LIBRARY_PATH"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Dynamic Lib Tests
        run: |
          make test.dynamic.lib PLATFORM=${{ matrix.platform }}
          CGO_ENABLED=1 CGO_LDFLAGS="-lduckdb -L${SRCDIR}dynamic-dir" ${{ matrix.ld_path_env_name }}=${SRCDIR}dynamic-dir go test -tags=duckdb_use_lib

  test-static-lib-darwin-arm64:
    name: Static Lib Tests Darwin ARM64
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        go: [1.24]
        include: [*darwin-arm64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Static Lib Tests Darwin ARM64
        run: |
          make test.static.lib.darwin.arm64
          CGO_ENABLED=1 CPPFLAGS="-DDUCKDB_STATIC_BUILD" CGO_LDFLAGS="-lduckdb_static_extension_loader -lduckdb_httplib -lduckdb_loadable_extensions -lautocomplete_extension -lcore_functions_extension -licu_extension -ljson_extension -lparquet_extension -ltpcds_extension -ltpch_extension -lduckdb_static -lc++ -L${SRCDIR}static-dir" go test -tags=duckdb_use_static_lib
