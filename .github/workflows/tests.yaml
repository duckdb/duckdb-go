name: Tests
on:
  push:
    branches:
      - main
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  go_test:
    name: Main Tests
    runs-on: &runner ${{ github.repository_owner == 'duckdb' && matrix.namespace || matrix.github }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
          - windows-amd64
        go: [1.24]
        # Keep Intel macOS and Windows AMD64 coverage after merge without delaying PR checks.
        exclude: &skip-on-pr ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"darwin-amd64"},{"platform":"windows-amd64"}]' || '[]') }}
        # Platforms map to GitHub-hosted runners by default and to DuckDB's Namespace
        # runners when the workflow runs in the duckdb organization. There is no
        # Namespace profile for Intel macOS, so runs-on falls back to github.
        include:
          # Includes run after exclusions; do not reintroduce skipped platforms on PRs.
          - &darwin-amd64 ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":"darwin-amd64","github":"macos-15-intel"}]') }}
          - &darwin-arm64 { platform: darwin-arm64, github: macos-26, namespace: namespace-profile-macos-arm64 }
          - &linux-amd64 { platform: linux-amd64, github: ubuntu-24.04, namespace: namespace-profile-linux-small }
          - &linux-arm64 { platform: linux-arm64, github: ubuntu-24.04-arm, namespace: namespace-profile-linux-arm64-small }
          - &windows-amd64 ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"platform":"windows-amd64","github":"windows-2025","namespace":"namespace-profile-windows-x64"}]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Main Tests
        run: go test -v
      - name: Test Vendored Consumer
        if: matrix.platform == 'linux-amd64'
        run: make test.vendor

  go_race_test:
    name: Race Tests
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform: [linux-amd64]
        go: [1.24]
        include: [*linux-amd64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Race Tests
        run: go test -race -count=1 ./...

  test_examples:
    name: Test Examples
    runs-on: *runner
    timeout-minutes: 15
    strategy:
      matrix:
        platform:
          - darwin-arm64
          - linux-amd64
        go: [1.24]
        include: [*darwin-arm64, *linux-amd64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test Examples
        run: make test.examples

  test-arrow:
    name: Test Arrow
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        platform:
          - darwin-arm64
          - linux-amd64
          - windows-amd64
        go: [1.24]
        exclude: *skip-on-pr
        include: [*darwin-arm64, *linux-amd64, *windows-amd64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Arrow Tests
        run: go test -v -tags=duckdb_arrow

  test-lib:
    name: Lib Tests
    runs-on: *runner
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        go: [1.24]
        link: [dynamic, static]
        platform:
          - darwin-amd64
          - darwin-arm64
          - linux-amd64
          - linux-arm64
        exclude: *skip-on-pr
        include: [*darwin-amd64, *darwin-arm64, *linux-amd64, *linux-arm64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run Lib Tests
        run: make test.${{ matrix.link }}
